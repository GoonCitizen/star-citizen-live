<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoonCitizen — Monitor</title>
<style>

  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --line:#2a313c;
    --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
    --good:#3fb950; --warn:#d29922; --raw:#6e7681; --kill:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 18px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  h1{font-size:17px;margin:0;font-weight:650}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.on{background:rgba(63,185,80,.15);color:var(--good)}
  .pill.off{background:rgba(248,81,73,.15);color:var(--kill)}
  .idchip{border:1px solid transparent;cursor:pointer;font-family:inherit}
  .idchip.off{background:rgba(210,153,34,.15);color:var(--warn)}
  .idchip:hover{border-color:var(--accent)}
  .counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .counts b{color:var(--text)}
  .counts .k b{color:var(--kill)}
  .ctrl{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px}
  input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:6px 9px;font-size:13px;min-width:240px}
  label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
  main{padding:16px 18px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
         display:flex;flex-direction:column;min-height:200px}
  .panel.full{grid-column:1 / -1}
  .panel h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
            display:flex;align-items:center;gap:8px;font-weight:600}
  .panel h2 .sub{color:var(--muted);font-weight:400;font-size:12px}
  .panel h2 .btn{margin-left:auto}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .feed{overflow:auto;max-height:46vh;padding:6px 0}
  .full .feed{max-height:40vh}
  .line{display:flex;gap:10px;align-items:flex-start;padding:5px 14px;border-bottom:1px solid #20262f}
  .line:hover{background:var(--panel2)}
  .time{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none}
  .b-good{background:rgba(63,185,80,.15);color:var(--good)}
  .b-warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .b-raw{background:rgba(110,118,129,.18);color:var(--raw)}
  .b-kill{background:rgba(248,81,73,.18);color:var(--kill)}
  .b-acc{background:rgba(59,130,246,.18);color:var(--accent)}
  .raw{font-family:'Cascadia Code',Consolas,monospace;font-size:12px;word-break:break-word;flex:1;line-height:1.45}
  .copy{opacity:0;font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;flex:none}
  .line:hover .copy{opacity:1}
  .mission{padding:8px 14px;border-bottom:1px solid #20262f}
  .mhead{display:flex;gap:10px;align-items:center}
  .mtitle{font-weight:600;flex:1}
  .mid{color:var(--muted);font-size:10.5px;font-family:'Cascadia Code',Consolas,monospace}
  .obj{margin:3px 0 0 26px;font-size:12.5px;color:var(--text)}
  .obj.muted{color:var(--muted);font-style:italic}
  .empty{color:var(--muted);padding:22px 14px;text-align:center;font-style:italic}
  mark{background:rgba(210,153,34,.35);color:inherit;border-radius:2px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 16px;font-size:13px;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .slrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .flab{font-size:11px;color:var(--muted);margin-right:3px;min-width:54px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .chip.on{background:rgba(59,130,246,.15);color:var(--accent);border-color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:12px 14px;width:100%}
  .mc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .mc .l{font-size:12px;color:var(--muted)}
  .mc .v{font-size:23px;font-weight:650;color:var(--text);line-height:1.25}
  .mc .d{font-size:11px;color:var(--muted);margin-top:2px}
  .lbr{display:grid;grid-template-columns:1fr 72px 86px 56px;gap:8px;align-items:center;padding:6px 8px;font-size:12.5px;border-radius:6px}
  .lbr.click{cursor:pointer}.lbr.click:hover{background:var(--panel2)}
  .line.rulehit{background:rgba(59,130,246,.10);box-shadow:inset 3px 0 0 var(--accent)}
  .logwarn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;margin:10px 14px 0;
    padding:9px 12px;font-size:12.5px}
  .lognav{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .lognav .sub{color:var(--muted);font-size:12px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .logbrowse{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:44vh}
  .logline{padding:0 14px;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #171c23}
  .logline.rulehit{background:rgba(59,130,246,.14);box-shadow:inset 3px 0 0 var(--accent)}
  .reparse{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
  .reparse .sub{color:var(--muted);font-size:12px}
  .rpkinds{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .rules{padding:6px 0;overflow:auto;max-height:44vh}
  .rule{display:grid;grid-template-columns:64px 250px 1fr 92px;gap:10px;align-items:center;
    padding:6px 14px;border-bottom:1px solid #20262f;font-size:12.5px}
  .rule.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .rule.on{background:rgba(59,130,246,.07)}
  .rule .rkind{font-weight:600;word-break:break-word}
  .rule .rpat{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){.rule{grid-template-columns:56px 1fr 80px}.rule .rpat{display:none}}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:14px}
  .home-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;
    text-align:left;cursor:pointer;color:var(--text);display:grid;gap:8px;align-content:start}
  .home-card:hover{border-color:var(--accent)}
  .home-card .hc-title{font-size:15px;font-weight:650}
  .home-card .hc-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .home-card .hc-stat{font-size:11.5px;color:var(--accent);font-family:'Cascadia Code',Consolas,monospace}


  .ob-overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.88);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .ob-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(560px,92vw);max-height:88vh;overflow:auto;padding:26px 30px}
  .ob-card h2{margin:0 0 4px;font-size:19px}
  .ob-card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .ob-field{margin:12px 0}
  .ob-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ob-field input,.ob-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:9px 11px;font-size:13.5px}
  .ob-field textarea{min-height:74px;font-family:'Cascadia Code',Consolas,monospace;resize:vertical}
  .ob-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .ob-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  .ob-btn:disabled{opacity:.45;cursor:default}
  .ob-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .ob-error{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;
    padding:9px 12px;font-size:13px;margin-top:12px}
  .ob-mnemonic{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0;
    font-family:'Cascadia Code',Consolas,monospace;font-size:13px}
  .ob-mnemonic span{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px}
  .ob-mnemonic i{color:var(--muted);font-style:normal;margin-right:6px;font-size:11px}
  .ob-warn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;
    padding:10px 12px;font-size:12.5px;line-height:1.5}
  .ob-check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;cursor:pointer}
  .ob-pk{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;color:var(--muted);
    word-break:break-all;margin-top:10px}


  .id-overlay{position:fixed;inset:0;z-index:45;background:rgba(8,10,14,.75);
    display:flex;align-items:flex-start;justify-content:center;padding:54px 16px 30px;backdrop-filter:blur(2px)}
  .id-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(620px,94vw);max-height:86vh;overflow:auto}
  .id-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);z-index:1}
  .id-head h2{margin:0;font-size:16px;flex:1}
  .id-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px}
  .id-x:hover{color:var(--text)}
  .id-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .id-sec:last-child{border-bottom:none}
  .id-sec h3{margin:0 0 4px;font-size:13px}
  .id-sec .d{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.5}
  .id-kv{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;word-break:break-all;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0}
  .id-kv b{color:var(--muted);font-weight:600;font-family:'Segoe UI',system-ui,sans-serif;font-size:11px}
  .id-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .id-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .id-btn:disabled{opacity:.45;cursor:default}
  .id-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .id-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .id-input{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box;flex:1;min-width:180px}
  .id-select{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12.5px}
  .id-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-top:8px}
  .id-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-top:8px}
  .id-warn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;padding:9px 12px;font-size:12.5px;line-height:1.5;margin-bottom:8px}
  .id-secret{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;
    font-family:'Cascadia Code',Consolas,monospace;font-size:12.5px;word-break:break-all;margin:8px 0}
  .id-secret.hidden{color:var(--muted);font-style:italic;font-family:'Segoe UI',system-ui,sans-serif}
  .id-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}
  .id-tag.on{background:rgba(63,185,80,.15);color:var(--good)}
  .id-tag.off{background:rgba(110,118,129,.18);color:var(--muted)}


  .gp-wrap{display:grid;gap:16px;grid-template-columns:minmax(280px,340px) 1fr;align-items:start}
  @media(max-width:900px){.gp-wrap{grid-template-columns:1fr}}
  .gp-me{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);
    padding:8px 14px;border-bottom:1px solid var(--line)}
  .gp-me code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--text);
    word-break:break-all}
  .gp-row{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #20262f;
    cursor:pointer}
  .gp-row:hover{background:var(--panel2)}
  .gp-row.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .gp-row .n{font-weight:600;flex:1}
  .gp-row .d{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .gp-form{padding:12px 14px;display:grid;gap:10px}
  .gp-form label{font-size:12px;color:var(--muted)}
  .gp-form input,.gp-form textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gp-form textarea{min-height:64px;font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;resize:vertical}
  .gp-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 16px;
    font-size:13px;font-weight:600;cursor:pointer;justify-self:start}
  .gp-btn:disabled{opacity:.45;cursor:default}
  .gp-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gp-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill);
    padding:2px 9px;font-size:11px;font-weight:500}
  .gp-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-member{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid #20262f}
  .gp-member code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;word-break:break-all;flex:1}
  .gp-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .gp-tag.creator{background:rgba(59,130,246,.18);color:var(--accent)}
  .gp-tag.you{background:rgba(63,185,80,.15);color:var(--good)}
  .gp-meta{padding:10px 14px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .gp-meta b{color:var(--text)}
  .gp-add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .gp-add input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12px;font-family:'Cascadia Code',Consolas,monospace}
  .gp-hint{color:var(--muted);padding:20px 14px;font-size:13px;line-height:1.6}
  .gp-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .gp-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .gp-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}


  .gpage{max-width:820px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .gpage-back{color:var(--muted);font-size:13px;text-decoration:none}
  .gpage-back:hover{color:var(--accent)}
  .gpage-hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
  .gpage-hero h1{margin:0 0 6px;font-size:22px}
  .gpage-hero .sub{color:var(--muted);font-size:13px;line-height:1.5}
  .gpage-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .gpage-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 14px;
    font-size:13px;font-weight:600;cursor:pointer}
  .gpage-btn:disabled{opacity:.45;cursor:default}
  .gpage-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gpage-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .gpage-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}
  .gpage-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .gpage-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .gpage-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gpage-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .gpage-panel .body{padding:14px 16px}
  .gpage-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-field{margin-bottom:10px}
  .gpage-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .gpage-field input,.gpage-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gpage-field textarea{min-height:70px;resize:vertical}
  .gpage-member{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;
    font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;word-break:break-all}
  .gpage-member:last-child{border-bottom:none}
  .gpage-app{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #20262f}
  .gpage-app:last-child{border-bottom:none}
  .gpage-app code{font-size:11px;word-break:break-all}
  .gpage-toggle{display:flex;align-items:center;gap:10px;font-size:13px}
  .gpage-toggle input{accent-color:var(--accent)}


  .lib-wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .lib-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .lib-bar .stat{color:var(--muted);font-size:12.5px}
  .lib-bar .stat b{color:var(--text)}
  .lib-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .lib-btn:hover{border-color:var(--accent)}
  .lib-btn.danger{color:var(--kill)}
  .lib-btn:disabled{opacity:.45;cursor:default}
  .lib-day h3{font-size:13px;color:var(--muted);margin:8px 0 8px;font-weight:600}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .lib-thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    cursor:pointer;background:var(--panel);padding:0}
  .lib-thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .lib-thumb:hover{border-color:var(--accent)}
  .lib-thumb .t{position:absolute;left:0;right:0;bottom:0;background:rgba(8,10,14,.72);
    color:var(--text);font-size:10.5px;padding:3px 7px;font-variant-numeric:tabular-nums;text-align:left}
  .lib-empty{color:var(--muted);text-align:center;font-style:italic;padding:40px 0;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.7}
  .lib-view{position:fixed;inset:0;z-index:48;background:rgba(8,10,14,.9);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(3px)}
  .lib-view img{max-width:92vw;max-height:80vh;border:1px solid var(--line);border-radius:8px}
  .lib-view .meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .lib-view .row{display:flex;gap:10px}


  .pr-wrap{max-width:860px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .pr-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pr-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .pr-panel .body{padding:14px 16px}
  .pr-hint{color:var(--muted);font-size:12.5px;line-height:1.55}
  .pr-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:10px}
  .pr-peer{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #20262f}
  .pr-peer:last-child{border-bottom:none}
  .pr-peer .u{flex:1;min-width:0}
  .pr-peer .url{font-family:'Cascadia Code',Consolas,monospace;font-size:12.5px;word-break:break-all}
  .pr-peer .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .pr-peer .meta .err{color:var(--kill)}
  .pr-peer .meta .ok{color:var(--good)}
  .pr-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .pr-btn:disabled{opacity:.45;cursor:default}
  .pr-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .pr-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill);padding:4px 10px;font-size:11px;font-weight:500}
  .pr-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  .pr-row input{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;box-sizing:border-box;
    font-family:'Cascadia Code',Consolas,monospace}
  .pr-id{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .pr-id code{font-size:11.5px;word-break:break-all;color:var(--text)}
  .pr-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px}
  .pr-tag.on{background:rgba(63,185,80,.15);color:var(--good)}
  .pr-tag.off{background:rgba(110,118,129,.18);color:var(--muted)}


  .st-overlay{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.7);
    display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 30px;backdrop-filter:blur(2px)}
  .st-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(640px,94vw);max-height:84vh;overflow:auto}
  .st-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);z-index:1}
  .st-head h2{margin:0;font-size:16px;flex:1}
  .st-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px}
  .st-x:hover{color:var(--text)}
  .st-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .st-sec h3{margin:0 0 4px;font-size:13px}
  .st-sec .d{color:var(--muted);font-size:12px;margin-bottom:10px}
  .st-field{display:grid;gap:5px;margin-bottom:10px}
  .st-field label{font-size:12px;color:var(--muted)}
  .st-field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box;
    font-family:'Cascadia Code',Consolas,monospace}
  .st-row{display:flex;gap:8px;align-items:center}
  .st-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .st-btn:disabled{opacity:.45;cursor:default}
  .st-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .st-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}
  .st-note{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-top:10px}
  .st-runtime{color:var(--muted);font-size:11.5px;display:grid;gap:3px;
    font-family:'Cascadia Code',Consolas,monospace}
  .st-runtime b{color:var(--text);font-weight:600}
  .gear{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;
    padding:5px 11px;font-size:14px;cursor:pointer;line-height:1}
  .gear:hover{border-color:var(--accent)}

</style>
</head>

  .ob-overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.88);

  .gp-wrap{display:grid;gap:16px;grid-template-columns:minmax(280px,340px) 1fr;align-items:start}
  @media(max-width:900px){.gp-wrap{grid-template-columns:1fr}}
  .gp-me{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);
    padding:8px 14px;border-bottom:1px solid var(--line)}
  .gp-me code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--text);
    word-break:break-all}
  .gp-row{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #20262f;
    cursor:pointer}
  .gp-row:hover{background:var(--panel2)}
  .gp-row.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .gp-row .n{font-weight:600;flex:1}
  .gp-row .d{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .gp-form{padding:12px 14px;display:grid;gap:10px}
  .gp-form label{font-size:12px;color:var(--muted)}
  .gp-form input,.gp-form textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gp-form textarea{min-height:64px;font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;resize:vertical}
  .gp-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 16px;
    font-size:13px;font-weight:600;cursor:pointer;justify-self:start}
  .gp-btn:disabled{opacity:.45;cursor:default}
  .gp-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gp-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill);
    padding:2px 9px;font-size:11px;font-weight:500}
  .gp-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-member{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid #20262f}
  .gp-member code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;word-break:break-all;flex:1}
  .gp-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .gp-tag.creator{background:rgba(59,130,246,.18);color:var(--accent)}
  .gp-tag.you{background:rgba(63,185,80,.15);color:var(--good)}
  .gp-meta{padding:10px 14px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .gp-meta b{color:var(--text)}
  .gp-add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .gp-add input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12px;font-family:'Cascadia Code',Consolas,monospace}
  .gp-hint{color:var(--muted);padding:20px 14px;font-size:13px;line-height:1.6}
  .gp-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .gp-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .gp-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}

  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --line:#2a313c;
    --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
    --good:#3fb950; --warn:#d29922; --raw:#6e7681; --kill:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 18px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  h1{font-size:17px;margin:0;font-weight:650}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.on{background:rgba(63,185,80,.15);color:var(--good)}
  .pill.off{background:rgba(248,81,73,.15);color:var(--kill)}
  .idchip{border:1px solid transparent;cursor:pointer;font-family:inherit}
  .idchip.off{background:rgba(210,153,34,.15);color:var(--warn)}
  .idchip:hover{border-color:var(--accent)}
  .counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .counts b{color:var(--text)}
  .counts .k b{color:var(--kill)}
  .ctrl{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px}
  input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:6px 9px;font-size:13px;min-width:240px}
  label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
  main{padding:16px 18px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
         display:flex;flex-direction:column;min-height:200px}
  .panel.full{grid-column:1 / -1}
  .panel h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
            display:flex;align-items:center;gap:8px;font-weight:600}
  .panel h2 .sub{color:var(--muted);font-weight:400;font-size:12px}
  .panel h2 .btn{margin-left:auto}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .feed{overflow:auto;max-height:46vh;padding:6px 0}
  .full .feed{max-height:40vh}
  .line{display:flex;gap:10px;align-items:flex-start;padding:5px 14px;border-bottom:1px solid #20262f}
  .line:hover{background:var(--panel2)}
  .time{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none}
  .b-good{background:rgba(63,185,80,.15);color:var(--good)}
  .b-warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .b-raw{background:rgba(110,118,129,.18);color:var(--raw)}
  .b-kill{background:rgba(248,81,73,.18);color:var(--kill)}
  .b-acc{background:rgba(59,130,246,.18);color:var(--accent)}
  .raw{font-family:'Cascadia Code',Consolas,monospace;font-size:12px;word-break:break-word;flex:1;line-height:1.45}
  .copy{opacity:0;font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;flex:none}
  .line:hover .copy{opacity:1}
  .mission{padding:8px 14px;border-bottom:1px solid #20262f}
  .mhead{display:flex;gap:10px;align-items:center}
  .mtitle{font-weight:600;flex:1}
  .mid{color:var(--muted);font-size:10.5px;font-family:'Cascadia Code',Consolas,monospace}
  .obj{margin:3px 0 0 26px;font-size:12.5px;color:var(--text)}
  .obj.muted{color:var(--muted);font-style:italic}
  .empty{color:var(--muted);padding:22px 14px;text-align:center;font-style:italic}
  mark{background:rgba(210,153,34,.35);color:inherit;border-radius:2px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 16px;font-size:13px;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .slrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .flab{font-size:11px;color:var(--muted);margin-right:3px;min-width:54px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .chip.on{background:rgba(59,130,246,.15);color:var(--accent);border-color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:12px 14px;width:100%}
  .mc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .mc .l{font-size:12px;color:var(--muted)}
  .mc .v{font-size:23px;font-weight:650;color:var(--text);line-height:1.25}
  .mc .d{font-size:11px;color:var(--muted);margin-top:2px}
  .lbr{display:grid;grid-template-columns:1fr 72px 86px 56px;gap:8px;align-items:center;padding:6px 8px;font-size:12.5px;border-radius:6px}
  .lbr.click{cursor:pointer}.lbr.click:hover{background:var(--panel2)}
  .line.rulehit{background:rgba(59,130,246,.10);box-shadow:inset 3px 0 0 var(--accent)}
  .logwarn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;margin:10px 14px 0;
    padding:9px 12px;font-size:12.5px}
  .lognav{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .lognav .sub{color:var(--muted);font-size:12px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .logbrowse{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:44vh}
  .logline{padding:0 14px;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #171c23}
  .logline.rulehit{background:rgba(59,130,246,.14);box-shadow:inset 3px 0 0 var(--accent)}
  .reparse{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
  .reparse .sub{color:var(--muted);font-size:12px}
  .rpkinds{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .rules{padding:6px 0;overflow:auto;max-height:44vh}
  .rule{display:grid;grid-template-columns:64px 250px 1fr 92px;gap:10px;align-items:center;
    padding:6px 14px;border-bottom:1px solid #20262f;font-size:12.5px}
  .rule.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .rule.on{background:rgba(59,130,246,.07)}
  .rule .rkind{font-weight:600;word-break:break-word}
  .rule .rpat{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){.rule{grid-template-columns:56px 1fr 80px}.rule .rpat{display:none}}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:14px}
  .home-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;
    text-align:left;cursor:pointer;color:var(--text);display:grid;gap:8px;align-content:start}
  .home-card:hover{border-color:var(--accent)}
  .home-card .hc-title{font-size:15px;font-weight:650}
  .home-card .hc-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .home-card .hc-stat{font-size:11.5px;color:var(--accent);font-family:'Cascadia Code',Consolas,monospace}

  .gpage{max-width:820px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .gpage-back{color:var(--muted);font-size:13px;text-decoration:none}
  .gpage-back:hover{color:var(--accent)}
  .gpage-hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
  .gpage-hero h1{margin:0 0 6px;font-size:22px}
  .gpage-hero .sub{color:var(--muted);font-size:13px;line-height:1.5}
  .gpage-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .gpage-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 14px;
    font-size:13px;font-weight:600;cursor:pointer}
  .gpage-btn:disabled{opacity:.45;cursor:default}
  .gpage-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gpage-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .gpage-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}
  .gpage-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .gpage-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .gpage-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gpage-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .gpage-panel .body{padding:14px 16px}
  .gpage-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-field{margin-bottom:10px}
  .gpage-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .gpage-field input,.gpage-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gpage-field textarea{min-height:70px;resize:vertical}
  .gpage-member{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;
    font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;word-break:break-all}
  .gpage-member:last-child{border-bottom:none}
  .gpage-app{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #20262f}
  .gpage-app:last-child{border-bottom:none}
  .gpage-app code{font-size:11px;word-break:break-all}
  .gpage-toggle{display:flex;align-items:center;gap:10px;font-size:13px}
