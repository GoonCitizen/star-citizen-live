<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoonCitizen — Monitor</title>
<style>

  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --line:#2a313c;
    --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
    --good:#3fb950; --warn:#d29922; --raw:#6e7681; --kill:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 18px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  h1{font-size:17px;margin:0;font-weight:650}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.on{background:rgba(63,185,80,.15);color:var(--good)}
  .pill.off{background:rgba(248,81,73,.15);color:var(--kill)}
  .idchip-wrap{position:relative}
  .idchip{border:1px solid transparent;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;max-width:min(280px,42vw)}
  .idchip.off{background:rgba(210,153,34,.15);color:var(--warn)}
  .idchip:hover,.idchip.open{border-color:var(--accent)}
  .idchip .id-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
  .idchip .id-dot.on{background:var(--good);box-shadow:0 0 0 2px rgba(63,185,80,.25)}
  .idchip .id-dot.share{outline:1px solid rgba(56,139,253,.55);outline-offset:1px}
  .idchip .id-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idchip .id-ship{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
  .id-flyout{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(360px,94vw);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);display:grid;gap:10px}
  .id-flyout .ff{display:grid;gap:4px}
  .id-flyout .ff label{font-size:11.5px;color:var(--muted)}
  .id-flyout select,.id-flyout input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 9px;font-size:12.5px;box-sizing:border-box}
  .id-flyout .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
  .id-flyout .meta{font-size:12px;color:var(--text)}
  .id-flyout .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .id-flyout .actions .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
  .id-flyout .actions .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .counts b{color:var(--text)}
  .counts .k b{color:var(--kill)}
  .ctrl{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px}
  input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:6px 9px;font-size:13px;min-width:240px}
  label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
  main{padding:16px 18px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
         display:flex;flex-direction:column;min-height:200px}
  .panel.full{grid-column:1 / -1}
  .panel h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
            display:flex;align-items:center;gap:8px;font-weight:600}
  .panel h2 .sub{color:var(--muted);font-weight:400;font-size:12px}
  .panel h2 .btn{margin-left:auto}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .feed{overflow:auto;max-height:46vh;padding:6px 0}
  .full .feed{max-height:40vh}
  .line{display:flex;gap:10px;align-items:flex-start;padding:5px 14px;border-bottom:1px solid #20262f}
  .line:hover{background:var(--panel2)}
  .time{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none}
  .b-good{background:rgba(63,185,80,.15);color:var(--good)}
  .b-warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .b-raw{background:rgba(110,118,129,.18);color:var(--raw)}
  .b-kill{background:rgba(248,81,73,.18);color:var(--kill)}
  .b-acc{background:rgba(59,130,246,.18);color:var(--accent)}
  .raw{font-family:'Cascadia Code',Consolas,monospace;font-size:12px;word-break:break-word;flex:1;line-height:1.45}
  .copy{opacity:0;font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;flex:none}
  .line:hover .copy{opacity:1}
  .mission{padding:8px 14px;border-bottom:1px solid #20262f}
  .mhead{display:flex;gap:10px;align-items:center}
  .mtitle{font-weight:600;flex:1}
  .mid{color:var(--muted);font-size:10.5px;font-family:'Cascadia Code',Consolas,monospace}
  .obj{margin:3px 0 0 26px;font-size:12.5px;color:var(--text)}
  .obj.muted{color:var(--muted);font-style:italic}
  .empty{color:var(--muted);padding:22px 14px;text-align:center;font-style:italic}
  mark{background:rgba(210,153,34,.35);color:inherit;border-radius:2px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 16px;font-size:13px;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .slrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .flab{font-size:11px;color:var(--muted);margin-right:3px;min-width:54px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .chip.on{background:rgba(59,130,246,.15);color:var(--accent);border-color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:12px 14px;width:100%}
  .mc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .mc .l{font-size:12px;color:var(--muted)}
  .mc .v{font-size:23px;font-weight:650;color:var(--text);line-height:1.25}
  .mc .d{font-size:11px;color:var(--muted);margin-top:2px}
  .lbr{display:grid;grid-template-columns:1fr 72px 86px 56px;gap:8px;align-items:center;padding:6px 8px;font-size:12.5px;border-radius:6px}
  .lbr.click{cursor:pointer}.lbr.click:hover{background:var(--panel2)}
  .line.rulehit{background:rgba(59,130,246,.10);box-shadow:inset 3px 0 0 var(--accent)}
  .logwarn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;margin:10px 14px 0;
    padding:9px 12px;font-size:12.5px}
  .lognav{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .lognav .sub{color:var(--muted);font-size:12px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .logbrowse{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:44vh}
  .logline{padding:0 14px;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #171c23}
  .logline.rulehit{background:rgba(59,130,246,.14);box-shadow:inset 3px 0 0 var(--accent)}
  .reparse{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
  .reparse .sub{color:var(--muted);font-size:12px}
  .rpkinds{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .rules{padding:6px 0;overflow:auto;max-height:44vh}
  .rule{display:grid;grid-template-columns:64px 250px 1fr 92px;gap:10px;align-items:center;
    padding:6px 14px;border-bottom:1px solid #20262f;font-size:12.5px}
  .rule.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .rule.on{background:rgba(59,130,246,.07)}
  .rule .rkind{font-weight:600;word-break:break-word}
  .rule .rpat{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){.rule{grid-template-columns:56px 1fr 80px}.rule .rpat{display:none}}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:14px}
  .tab-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;
    font-weight:700;min-width:16px;padding:0 5px;margin-left:6px;line-height:16px;vertical-align:text-top}
  .bell{position:relative;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:5px 11px;font-size:14px;cursor:pointer;line-height:1}
  .bell:hover{border-color:var(--accent)}
  .bell.on{border-color:var(--accent);color:var(--accent)}
  .bell .dot{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;border-radius:999px;
    font-size:10px;font-weight:700;min-width:16px;padding:0 4px;line-height:16px;text-align:center}
  .home-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;
    text-align:left;cursor:pointer;color:var(--text);display:grid;gap:8px;align-content:start}
  .home-card:hover{border-color:var(--accent)}
  .home-card .hc-title{font-size:15px;font-weight:650}
  .home-card .hc-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .home-card .hc-stat{font-size:11.5px;color:var(--accent);font-family:'Cascadia Code',Consolas,monospace}
  .home-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;align-items:center}
  .home-tools .btn.on,.live-bar .btn.on{border-color:var(--accent);color:var(--accent)}
  .home-tools .sub{margin-left:auto}
  .home-views{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;align-items:center}
  .home-flyover{border-top:1px solid var(--line)}
  .gc-modal-backdrop{position:fixed;inset:0;z-index:10040;background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;padding:16px}
  .gc-modal{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
    max-width:720px;width:100%;max-height:min(86vh,900px);overflow:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .gc-modal > .panel{border:none;border-radius:0;min-height:0}
  .gc-modal > .panel + .panel{border-top:1px solid var(--line)}
  .live-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px}
  .live-bar .sub{flex:1;color:var(--muted);font-size:12px}
  .live-stream{display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:420px}
  .live-filters{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
  .live-filters input[type=text]{min-width:0;width:100%;max-width:480px}
  .live-msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .live-msg{display:grid;gap:2px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent}
  .live-msg:hover{border-color:var(--line)}
  .live-msg.peer{box-shadow:inset 3px 0 0 var(--accent)}
  .live-msg .m{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .live-msg .who{font-weight:600;font-size:12.5px}
  .live-msg .who.peer{color:var(--accent)}
  .live-msg .t{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums;margin-left:auto}
  .live-msg .b{font-size:13.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
  .live-msg .meta{color:var(--muted);font-size:11px}
  .live-msg .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
  .live-msg .fb{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:transparent;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-msg .fb .fk{opacity:.75;font-weight:500;margin-right:4px;text-transform:uppercase;font-size:9.5px;letter-spacing:.03em}
  .live-msg .fb-player{color:#7ee787;border-color:rgba(126,231,135,.35);background:rgba(126,231,135,.08)}
  .live-msg .fb-mission{color:#79c0ff;border-color:rgba(121,192,255,.35);background:rgba(121,192,255,.08)}
  .live-msg .fb-type{color:#d2a8ff;border-color:rgba(210,168,255,.35);background:rgba(210,168,255,.08)}
  .live-msg .fb-faction{color:#ffa657;border-color:rgba(255,166,87,.35);background:rgba(255,166,87,.08)}
  .live-msg .fb-outcome{color:#3fb950;border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.08)}
  .live-msg .fb-weapon,.live-msg .fb-ship{color:#ff7b72;border-color:rgba(255,123,114,.35);background:rgba(255,123,114,.08)}
  .live-msg .fb-zone,.live-msg .fb-destination{color:#a5d6ff;border-color:rgba(165,214,255,.35);background:rgba(165,214,255,.08)}
  .live-msg .fb-channel,.live-msg .fb-status{color:var(--muted);border-color:var(--line)}
  .live-msg .fb-npc{color:var(--warn);border-color:rgba(210,153,34,.35);background:rgba(210,153,34,.1)}
  .live-msg .prov{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
  .live-msg .prov .plabel{font-weight:600}
  .live-msg .prov .plabel.peer{color:var(--accent)}
  .live-msg .prov .plabel.self{color:var(--good)}
  .live-msg .prov code{font-size:10.5px;color:var(--text)}
  .live-msg .copy,.live-msg .rawtog{font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
  .live-msg .copy{opacity:0}
  .live-msg:hover .copy{opacity:1}
  .live-msg .rawtog{color:var(--muted)}
  .live-msg .rawtog:hover,.live-msg .rawtog.on{color:var(--accent)}
  .live-msg .rawline{margin-top:6px;padding:8px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
    font-family:'Cascadia Code',Consolas,monospace;font-size:11px;line-height:1.45;color:var(--muted);
    word-break:break-word;white-space:pre-wrap}
  .b-chat{background:rgba(59,130,246,.18);color:var(--accent)}
  .b-bcast{background:rgba(163,113,247,.18);color:#a371f7}
  .b-peer{background:rgba(59,130,246,.12);color:var(--accent)}


  .lb-wrap{padding:10px 14px 14px}
  .lb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .lb-path{flex:1;min-width:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px}
  .lb-crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px;font-size:12px}
  .lb-crumb{background:transparent;border:none;color:var(--accent);cursor:pointer;padding:2px 4px;
    font-size:12px;font-family:inherit}
  .lb-crumb:hover{text-decoration:underline}
  .lb-crumb.here{color:var(--text);cursor:default;font-weight:600}
  .lb-sep{color:var(--muted)}
  .lb-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .lb-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;
    background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--text);
    padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .lb-item:last-child{border-bottom:none}
  .lb-item:hover{background:var(--panel2)}
  .lb-item.sel{background:rgba(88,166,255,.08)}
  .lb-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-item input[type=checkbox]{margin:0;accent-color:var(--accent)}
  .lb-empty{color:var(--muted);font-size:12.5px;padding:16px;text-align:center;font-style:italic}
  .lb-err{color:var(--kill);font-size:12px;margin:6px 0}
  .lb-imported{margin-top:10px}
  .lb-imported li{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:3px 0;
    border-bottom:1px solid var(--line);list-style:none}
  .lb-imported ul{margin:0;padding:0}
  .lb-imported .rm{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
  .lb-imported .rm:hover{border-color:var(--kill);color:var(--kill)}
  .lb-hint{color:var(--muted);font-size:11.5px;line-height:1.5;margin:0 0 10px}
  .lb-selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;
    font-size:12px;color:var(--muted)}


  .ob-overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.88);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .ob-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(560px,92vw);max-height:88vh;overflow:auto;padding:26px 30px}
  .ob-card h2{margin:0 0 4px;font-size:19px}
  .ob-card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .ob-field{margin:12px 0}
  .ob-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ob-field input,.ob-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:9px 11px;font-size:13.5px}
  .ob-field textarea{min-height:74px;font-family:'Cascadia Code',Consolas,monospace;resize:vertical}
  .ob-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .ob-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  .ob-btn:disabled{opacity:.45;cursor:default}
  .ob-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .ob-error{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;
    padding:9px 12px;font-size:13px;margin-top:12px}
  .ob-mnemonic{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0;
    font-family:'Cascadia Code',Consolas,monospace;font-size:13px}
  .ob-mnemonic span{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px}
  .ob-mnemonic i{color:var(--muted);font-style:normal;margin-right:6px;font-size:11px}
  .ob-warn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;
    padding:10px 12px;font-size:12.5px;line-height:1.5}
  .ob-check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;cursor:pointer}
  .ob-pk{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;color:var(--muted);
    word-break:break-all;margin-top:10px}


  .id-overlay{position:fixed;inset:0;z-index:45;background:rgba(8,10,14,.75);
    display:flex;align-items:flex-start;justify-content:center;padding:54px 16px 30px;backdrop-filter:blur(2px)}
  .id-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(620px,94vw);max-height:86vh;overflow:auto}
  .id-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);z-index:1}
  .id-head h2{margin:0;font-size:16px;flex:1}
  .id-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px}
  .id-x:hover{color:var(--text)}
  .id-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .id-sec:last-child{border-bottom:none}
  .id-sec h3{margin:0 0 4px;font-size:13px}
  .id-sec .d{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.5}

.group-offer-modal-backdrop {
  position: fixed; inset: 0; z-index: 10050;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.group-offer-modal {
  background: #1a1f2a; color: #e8ecf4; border: 1px solid #3a4558;
  border-radius: 8px; max-width: 480px; width: 100%; padding: 20px 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  font-family: system-ui, sans-serif;
}
.group-offer-modal h2 { margin: 0 0 8px; font-size: 1.15rem; }
.group-offer-modal p { margin: 0 0 10px; font-size: 0.92rem; color: #b8c0d0; line-height: 1.45; }
.group-offer-modal .meta { font-size: 0.8rem; color: #8a94a8; word-break: break-all; margin-bottom: 14px; }
.group-offer-modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.group-offer-modal button {
  cursor: pointer; border-radius: 4px; border: 1px solid #4a5568;
  background: #2a3344; color: #e8ecf4; padding: 8px 14px; font-size: 0.9rem;
}
.group-offer-modal button.primary { background: #3d6ea5; border-color: #4a7eb8; }
.group-offer-modal button:disabled { opacity: 0.5; cursor: default; }
.group-offer-modal .err { color: #f08080; font-size: 0.85rem; margin-bottom: 10px; }
.group-offer-modal textarea {
  width: 100%; min-height: 110px; box-sizing: border-box;
  background: #0e1218; color: #e8ecf4; border: 1px solid #3a4558;
  border-radius: 6px; padding: 10px 12px; font-size: 12px;

}
.group-offer-modal textarea:focus { outline: none; border-color: #4a7eb8; }

  .fl-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer}
  .fl-btn:disabled{opacity:.45;cursor:default}
  .fl-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .fl-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .fl-btn.mini{padding:3px 8px;font-size:11px}
  .fl-chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:3px 10px;font-size:11.5px;cursor:pointer}
  .fl-chip.on{background:rgba(56,139,253,.15);border-color:var(--accent);color:var(--accent)}
  .fl-list{display:grid;gap:10px}
  .fl-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel2);
    display:grid;gap:8px;cursor:pointer}
  .fl-card:hover,.fl-card.on{border-color:var(--accent)}
  .fl-card .title{font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
  .fl-card .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
  .fl-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.02em}
  .fl-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .fl-tag.peers{background:rgba(56,139,253,.15);color:var(--accent)}
  .fl-tag.groups{background:rgba(210,153,34,.15);color:var(--warn,#d29922)}
  .fl-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .fl-tag.remote{background:rgba(163,113,247,.15);color:#a371f7}
  .fl-tag.custom{background:rgba(56,139,253,.12);color:var(--accent)}
  .fl-ships{display:grid;gap:6px;margin-top:4px}
  .fl-ship{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .fl-ship .n{font-weight:600}
  .fl-ship .s{color:var(--muted);font-size:11px;font-family:'Cascadia Code',Consolas,monospace;word-break:break-all}
  .fl-ship .ops{display:flex;gap:6px;align-items:center}
  .fl-ship .ops input{width:52px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:3px 6px;font-size:12px}
  .fl-form{display:grid;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .fl-form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
  .fl-form input,.fl-form select{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12.5px}
  .fl-groups{display:flex;flex-wrap:wrap;gap:8px}
  .fl-groups label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer}
  .fl-empty{color:var(--muted);text-align:center;font-style:italic;padding:28px 0;font-size:13px;line-height:1.7}
  .fl-samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fl-split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px}
  @media (max-width:840px){.fl-split{grid-template-columns:1fr}}
  .fl-search{display:grid;gap:8px}
  .fl-search input{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;width:100%;box-sizing:border-box}
  .fl-hits{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .fl-hit{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;
    border-bottom:1px solid #20262f;font-size:12px;cursor:pointer}
  .fl-hit:last-child{border-bottom:none}
  .fl-hit:hover{background:rgba(56,139,253,.08)}
  .fl-hit .meta{color:var(--muted);font-size:11px}


  .st-overlay{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.7);
    display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 30px;backdrop-filter:blur(2px)}
  .st-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(640px,94vw);max-height:84vh;overflow:auto}
  .st-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);z-index:1}
  .st-head h2{margin:0;font-size:16px;flex:1}
  .st-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 8px}
  .st-x:hover{color:var(--text)}
  .st-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .st-sec h3{margin:0 0 4px;font-size:13px}
  .st-sec .d{color:var(--muted);font-size:12px;margin-bottom:10px}
  .st-field{display:grid;gap:5px;margin-bottom:10px}
  .st-field label{font-size:12px;color:var(--muted)}
  .st-field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box;
    font-family:'Cascadia Code',Consolas,monospace}
  .st-row{display:flex;gap:8px;align-items:center}
  .st-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .st-btn:disabled{opacity:.45;cursor:default}
  .st-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .st-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}
  .st-note{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;padding:8px 11px;font-size:12.5px;margin-top:10px}
  .st-runtime{color:var(--muted);font-size:11.5px;display:grid;gap:3px;
    font-family:'Cascadia Code',Consolas,monospace}
  .st-runtime b{color:var(--text);font-weight:600}
  .gear{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;
    padding:5px 11px;font-size:14px;cursor:pointer;line-height:1}
  .gear:hover{border-color:var(--accent)}


  .wa-wrap{max-width:980px;margin:0 auto;padding:18px;display:grid;gap:14px}
  .wa-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .wa-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:8px;align-items:center}
  .wa-panel h2 .sub{color:var(--muted);font-weight:400;font-size:12px;flex:1}
  .wa-body{padding:14px 16px}
  .wa-kv{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .wa-kv b{color:var(--text)}
  .wa-row{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid #20262f;flex-wrap:wrap}
  .wa-row:last-child{border-bottom:none}
  .wa-name{font-weight:600;font-size:13px;min-width:140px}
  .wa-addr{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;word-break:break-all;flex:1;min-width:200px;color:var(--text)}
  .wa-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px}
  .wa-tag.btc{background:rgba(247,147,26,.16);color:#f7931a}
  .wa-tag.ok{background:rgba(63,185,80,.15);color:var(--good)}
  .wa-tag.warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .wa-tag.mut{background:rgba(110,118,129,.18);color:var(--muted)}
  .wa-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:4px 11px;font-size:11.5px;cursor:pointer}
  .wa-btn:hover{border-color:var(--accent)}
  .wa-note{color:var(--muted);font-size:12px;padding:12px 16px;line-height:1.6}

</style>
</head>

  .ob-overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.88);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .ob-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(560px,92vw);max-height:88vh;overflow:auto;padding:26px 30px}
  .ob-card h2{margin:0 0 4px;font-size:19px}
  .ob-card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .ob-field{margin:12px 0}
  .ob-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ob-field input,.ob-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:9px 11px;font-size:13.5px}
  .ob-field textarea{min-height:74px;font-family:'Cascadia Code',Consolas,monospace;resize:vertical}
  .ob-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .ob-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  .ob-btn:disabled{opacity:.45;cursor:default}
  .ob-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .ob-error{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;
    padding:9px 12px;font-size:13px;margin-top:12px}
  .ob-mnemonic{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0;
    font-family:'Cascadia Code',Consolas,monospace;font-size:13px}
  .ob-mnemonic span{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px}
  .ob-mnemonic i{color:var(--muted);font-style:normal;margin-right:6px;font-size:11px}
  .ob-warn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;
    padding:10px 12px;font-size:12.5px;line-height:1.5}
  .ob-check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;cursor:pointer}
  .ob-pk{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;color:var(--muted);
    word-break:break-all;margin-top:10px}

.group-offer-modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.group-offer-modal button {
  cursor: pointer; border-radius: 4px; border: 1px solid #4a5568;
  background: #2a3344; color: #e8ecf4; padding: 8px 14px; font-size: 0.9rem;
}
.group-offer-modal button.primary { background: #3d6ea5; border-color: #4a7eb8; }
.group-offer-modal button:disabled { opacity: 0.5; cursor: default; }
.group-offer-modal .err { color: #f08080; font-size: 0.85rem; margin-bottom: 10px; }
.group-offer-modal textarea {
  width: 100%; min-height: 110px; box-sizing: border-box;
  background: #0e1218; color: #e8ecf4; border: 1px solid #3a4558;
  border-radius: 6px; padding: 10px 12px; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  resize: vertical; margin: 0 0 12px;
}
.group-offer-modal textarea:focus { outline: none; border-color: #4a7eb8; }

  .gp-wrap{display:grid;gap:16px;grid-template-columns:minmax(280px,340px) 1fr;align-items:start}
  @media(max-width:900px){.gp-wrap{grid-template-columns:1fr}}
  .gp-me{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);
    padding:8px 14px;border-bottom:1px solid var(--line)}
  .gp-me code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--text);
    word-break:break-all}
  .gp-row{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #20262f;
    cursor:pointer}
  .gp-row:hover{background:var(--panel2)}
  .gp-row.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .gp-row .n{font-weight:600;flex:1}
  .gp-row .d{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .gp-form{padding:12px 14px;display:grid;gap:10px}
  .gp-form label{font-size:12px;color:var(--muted)}
  .gp-form input,.gp-form textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gp-form textarea{min-height:64px;font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;resize:vertical}
  .gp-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 16px;
    font-size:13px;font-weight:600;cursor:pointer;justify-self:start}
  .gp-btn:disabled{opacity:.45;cursor:default}
  .gp-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gp-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill);
    padding:2px 9px;font-size:11px;font-weight:500}
  .gp-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:8px 11px;font-size:12.5px;margin:0 14px 10px}
  .gp-member{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid #20262f}
  .gp-member code{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;word-break:break-all;flex:1}
  .gp-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .gp-tag.creator{background:rgba(59,130,246,.18);color:var(--accent)}
  .gp-tag.you{background:rgba(63,185,80,.15);color:var(--good)}
  .gp-meta{padding:10px 14px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .gp-meta b{color:var(--text)}
  .gp-add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .gp-add input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12px;font-family:'Cascadia Code',Consolas,monospace}
  .gp-hint{color:var(--muted);padding:20px 14px;font-size:13px;line-height:1.6}
  .gp-tag.public{background:rgba(63,185,80,.15);color:var(--good)}

  .pr-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}

  .pr-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.02em}

  .pr-conns{margin-top:10px;font-size:11.5px;color:var(--muted)}

  .pr-hubs{display:grid;gap:8px;margin-top:10px}

  .pr-hub code{color:var(--text);font-size:11.5px}

  .fl-wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .fl-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .fl-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .fl-panel h2 .sub{font-weight:500;color:var(--muted);font-size:12px}
  .fl-panel .body{padding:14px 16px}
  .fl-hint{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0 0 12px}
  .fl-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:10px}
  .fl-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:10px}
  .fl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .fl-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer}
  .fl-btn:disabled{opacity:.45;cursor:default}
  .fl-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .fl-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .fl-btn.mini{padding:3px 8px;font-size:11px}
  .fl-chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:3px 10px;font-size:11.5px;cursor:pointer}
  .fl-chip.on{background:rgba(56,139,253,.15);border-color:var(--accent);color:var(--accent)}
  .fl-list{display:grid;gap:10px}
  .fl-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel2);
    display:grid;gap:8px;cursor:pointer}
  .fl-card:hover,.fl-card.on{border-color:var(--accent)}
  .fl-card .title{font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
  .fl-card .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
  .fl-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.02em}
  .fl-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .fl-tag.peers{background:rgba(56,139,253,.15);color:var(--accent)}
  .fl-tag.groups{background:rgba(210,153,34,.15);color:var(--warn,#d29922)}
  .fl-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .fl-tag.remote{background:rgba(163,113,247,.15);color:#a371f7}
  .fl-tag.custom{background:rgba(56,139,253,.12);color:var(--accent)}
  .fl-ships{display:grid;gap:6px;margin-top:4px}
  .fl-ship{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .fl-ship .n{font-weight:600}
  .fl-ship .s{color:var(--muted);font-size:11px;font-family:'Cascadia Code',Consolas,monospace;word-break:break-all}
  .fl-ship .ops{display:flex;gap:6px;align-items:center}
  .fl-ship .ops input{width:52px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:3px 6px;font-size:12px}
  .fl-form{display:grid;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .fl-form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
  .fl-form input,.fl-form select{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-size:12.5px}
  .fl-groups{display:flex;flex-wrap:wrap;gap:8px}
  .fl-groups label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer}
  .fl-empty{color:var(--muted);text-align:center;font-style:italic;padding:28px 0;font-size:13px;line-height:1.7}
  .fl-samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fl-split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px}
  @media (max-width:840px){.fl-split{grid-template-columns:1fr}}
  .fl-search{display:grid;gap:8px}
  .fl-search input{background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;width:100%;box-sizing:border-box}
  .fl-hits{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .fl-hit{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;
    border-bottom:1px solid #20262f;font-size:12px;cursor:pointer}
  .fl-hit:last-child{border-bottom:none}
  .fl-hit:hover{background:rgba(56,139,253,.08)}

  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --line:#2a313c;
    --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
    --good:#3fb950; --warn:#d29922; --raw:#6e7681; --kill:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 18px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  h1{font-size:17px;margin:0;font-weight:650}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.on{background:rgba(63,185,80,.15);color:var(--good)}
  .pill.off{background:rgba(248,81,73,.15);color:var(--kill)}
  .idchip-wrap{position:relative}
  .idchip{border:1px solid transparent;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;max-width:min(280px,42vw)}
  .idchip.off{background:rgba(210,153,34,.15);color:var(--warn)}
  .idchip:hover,.idchip.open{border-color:var(--accent)}
  .idchip .id-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
  .idchip .id-dot.on{background:var(--good);box-shadow:0 0 0 2px rgba(63,185,80,.25)}
  .idchip .id-dot.share{outline:1px solid rgba(56,139,253,.55);outline-offset:1px}
  .idchip .id-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idchip .id-ship{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
  .id-flyout{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(360px,94vw);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);display:grid;gap:10px}
  .id-flyout .ff{display:grid;gap:4px}
  .id-flyout .ff label{font-size:11.5px;color:var(--muted)}
  .id-flyout select,.id-flyout input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 9px;font-size:12.5px;box-sizing:border-box}
  .id-flyout .hint{font-size:11.5px;color:var(--muted);line-height:1.4}
  .id-flyout .meta{font-size:12px;color:var(--text)}
  .id-flyout .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .id-flyout .actions .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
  .id-flyout .actions .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .counts b{color:var(--text)}
  .counts .k b{color:var(--kill)}
  .ctrl{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px}
  input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:6px 9px;font-size:13px;min-width:240px}
  label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
  main{padding:16px 18px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
         display:flex;flex-direction:column;min-height:200px}
  .panel.full{grid-column:1 / -1}
  .panel h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
            display:flex;align-items:center;gap:8px;font-weight:600}
  .panel h2 .sub{color:var(--muted);font-weight:400;font-size:12px}
  .panel h2 .btn{margin-left:auto}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .feed{overflow:auto;max-height:46vh;padding:6px 0}
  .full .feed{max-height:40vh}
  .line{display:flex;gap:10px;align-items:flex-start;padding:5px 14px;border-bottom:1px solid #20262f}
  .line:hover{background:var(--panel2)}
  .time{color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none}
  .b-good{background:rgba(63,185,80,.15);color:var(--good)}
  .b-warn{background:rgba(210,153,34,.18);color:var(--warn)}
  .b-raw{background:rgba(110,118,129,.18);color:var(--raw)}
  .b-kill{background:rgba(248,81,73,.18);color:var(--kill)}
  .b-acc{background:rgba(59,130,246,.18);color:var(--accent)}
  .raw{font-family:'Cascadia Code',Consolas,monospace;font-size:12px;word-break:break-word;flex:1;line-height:1.45}
  .copy{opacity:0;font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;flex:none}
  .line:hover .copy{opacity:1}
  .mission{padding:8px 14px;border-bottom:1px solid #20262f}
  .mhead{display:flex;gap:10px;align-items:center}
  .mtitle{font-weight:600;flex:1}
  .mid{color:var(--muted);font-size:10.5px;font-family:'Cascadia Code',Consolas,monospace}
  .obj{margin:3px 0 0 26px;font-size:12.5px;color:var(--text)}
  .obj.muted{color:var(--muted);font-style:italic}
  .empty{color:var(--muted);padding:22px 14px;text-align:center;font-style:italic}
  mark{background:rgba(210,153,34,.35);color:inherit;border-radius:2px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 16px;font-size:13px;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .slrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .flab{font-size:11px;color:var(--muted);margin-right:3px;min-width:54px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .chip.on{background:rgba(59,130,246,.15);color:var(--accent);border-color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:12px 14px;width:100%}
  .mc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .mc .l{font-size:12px;color:var(--muted)}
  .mc .v{font-size:23px;font-weight:650;color:var(--text);line-height:1.25}
  .mc .d{font-size:11px;color:var(--muted);margin-top:2px}
  .lbr{display:grid;grid-template-columns:1fr 72px 86px 56px;gap:8px;align-items:center;padding:6px 8px;font-size:12.5px;border-radius:6px}
  .lbr.click{cursor:pointer}.lbr.click:hover{background:var(--panel2)}
  .line.rulehit{background:rgba(59,130,246,.10);box-shadow:inset 3px 0 0 var(--accent)}
  .logwarn{background:rgba(210,153,34,.12);color:var(--warn);border-radius:7px;margin:10px 14px 0;
    padding:9px 12px;font-size:12.5px}
  .lognav{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .lognav .sub{color:var(--muted);font-size:12px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .logbrowse{font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:44vh}
  .logline{padding:0 14px;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #171c23}
  .logline.rulehit{background:rgba(59,130,246,.14);box-shadow:inset 3px 0 0 var(--accent)}
  .reparse{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
  .reparse .sub{color:var(--muted);font-size:12px}
  .rpkinds{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .rules{padding:6px 0;overflow:auto;max-height:44vh}
  .rule{display:grid;grid-template-columns:64px 250px 1fr 92px;gap:10px;align-items:center;
    padding:6px 14px;border-bottom:1px solid #20262f;font-size:12.5px}
  .rule.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .rule.on{background:rgba(59,130,246,.07)}
  .rule .rkind{font-weight:600;word-break:break-word}
  .rule .rpat{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){.rule{grid-template-columns:56px 1fr 80px}.rule .rpat{display:none}}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:14px}
  .tab-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;
    font-weight:700;min-width:16px;padding:0 5px;margin-left:6px;line-height:16px;vertical-align:text-top}
  .bell{position:relative;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:5px 11px;font-size:14px;cursor:pointer;line-height:1}
  .bell:hover{border-color:var(--accent)}
  .bell.on{border-color:var(--accent);color:var(--accent)}
  .bell .dot{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;border-radius:999px;
    font-size:10px;font-weight:700;min-width:16px;padding:0 4px;line-height:16px;text-align:center}
  .home-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;
    text-align:left;cursor:pointer;color:var(--text);display:grid;gap:8px;align-content:start}
  .home-card:hover{border-color:var(--accent)}
  .home-card .hc-title{font-size:15px;font-weight:650}
  .home-card .hc-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .home-card .hc-stat{font-size:11.5px;color:var(--accent);font-family:'Cascadia Code',Consolas,monospace}
  .home-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;align-items:center}
  .home-tools .btn.on,.live-bar .btn.on{border-color:var(--accent);color:var(--accent)}
  .home-tools .sub{margin-left:auto}
  .home-views{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;align-items:center}
  .home-flyover{border-top:1px solid var(--line)}
  .gc-modal-backdrop{position:fixed;inset:0;z-index:10040;background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;padding:16px}

  .gc-modal > .panel + .panel{border-top:1px solid var(--line)}
  .live-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px}
  .live-bar .sub{flex:1;color:var(--muted);font-size:12px}
  .live-stream{display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:420px}
  .live-filters{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}

  .live-msg{display:grid;gap:2px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid transparent}
  .live-msg:hover{border-color:var(--line)}
  .live-msg.peer{box-shadow:inset 3px 0 0 var(--accent)}
  .live-msg .m{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .live-msg .who{font-weight:600;font-size:12.5px}
  .live-msg .who.peer{color:var(--accent)}
  .live-msg .t{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums;margin-left:auto}
  .live-msg .b{font-size:13.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
  .live-msg .meta{color:var(--muted);font-size:11px}
  .live-msg .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
  .live-msg .fb{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:transparent;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-msg .fb .fk{opacity:.75;font-weight:500;margin-right:4px;text-transform:uppercase;font-size:9.5px;letter-spacing:.03em}
  .live-msg .fb-player{color:#7ee787;border-color:rgba(126,231,135,.35);background:rgba(126,231,135,.08)}
  .live-msg .fb-mission{color:#79c0ff;border-color:rgba(121,192,255,.35);background:rgba(121,192,255,.08)}
  .live-msg .fb-type{color:#d2a8ff;border-color:rgba(210,168,255,.35);background:rgba(210,168,255,.08)}
  .live-msg .fb-faction{color:#ffa657;border-color:rgba(255,166,87,.35);background:rgba(255,166,87,.08)}
  .live-msg .fb-outcome{color:#3fb950;border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.08)}

  .gpage{max-width:820px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .gpage-back{color:var(--muted);font-size:13px;text-decoration:none}
  .gpage-back:hover{color:var(--accent)}
  .gpage-hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
  .gpage-hero h1{margin:0 0 6px;font-size:22px}
  .gpage-hero .sub{color:var(--muted);font-size:13px;line-height:1.5}
  .gpage-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .gpage-btn{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:8px 14px;
    font-size:13px;font-weight:600;cursor:pointer}
  .gpage-btn:disabled{opacity:.45;cursor:default}
  .gpage-btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .gpage-btn.danger{background:transparent;border:1px solid var(--line);color:var(--kill)}
  .gpage-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}
  .gpage-tag.public{background:rgba(63,185,80,.15);color:var(--good)}
  .gpage-tag.private{background:rgba(110,118,129,.18);color:var(--muted)}
  .gpage-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gpage-panel h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .gpage-panel .body{padding:14px 16px}
  .gpage-err{background:rgba(248,81,73,.12);color:var(--kill);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-ok{background:rgba(63,185,80,.12);color:var(--good);border-radius:7px;padding:9px 12px;font-size:13px}
  .gpage-field{margin-bottom:10px}
  .gpage-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .gpage-field input,.gpage-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .gpage-field textarea{min-height:70px;resize:vertical}
  .gpage-member{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;
    font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;word-break:break-all}
  .gpage-member:last-child{border-bottom:none}
  .gpage-app{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid #20262f}
  .gpage-app:last-child{border-bottom:none}
  .gpage-app code{font-size:11px;word-break:break-all}
  .gpage-toggle{display:flex;align-items:center;gap:10px;font-size:13px}
  .gpage-toggle input{accent-color:var(--accent)}
