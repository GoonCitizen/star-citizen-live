# Nginx reverse proxy for a public GoonCitizen LiveRelay.
# Include from the http {} context (map + upstream + server).
#
#   sudo cp deploy/nginx-relay.example.conf /etc/nginx/sites-available/relay.goon.vc
#   sudo ln -s /etc/nginx/sites-available/relay.goon.vc /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d relay.goon.vc
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS → loopback LiveRelay (:3041). Fabric Peer (:7777) is TCP/NOISE on the
# public NIC — do not reverse-proxy it. See docs/PRODUCTION.md.
#
# Do not copy goon.vc's Hub nginx example (upstream :8080). This origin is
# LiveRelay, not Hub HTTP.

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

upstream gooncitizen_relay {
	server 127.0.0.1:3041;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name relay.goon.vc;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name relay.goon.vc;

	# certbot --nginx fills these in. Until then, nginx -t will fail:
	# ssl_certificate /etc/letsencrypt/live/relay.goon.vc/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/relay.goon.vc/privkey.pem;
	# include /etc/letsencrypt/options-ssl-nginx.conf;
	# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 32m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;

	# Optional static ops notes. Must be before the catch-all LiveRelay proxy.
	# Production document root is often a symlink to a checkout's assets/.
	root /var/www/goon.vc/html;
	location = /downstream.agents.md {
		try_files $uri =404;
		default_type text/markdown;
		add_header Content-Disposition 'attachment; filename="downstream.agents.md"';
	}
	location ^~ /patches/ {
		try_files $uri $uri/ =404;
		default_type text/plain;
		autoindex on;
	}
	# Agent probe JSON dumps (discord events, adversary probes, …).
	# Populate with: SC_AGENT_STATIC_ROOT=/var/www/goon.vc/html npm run probes:publish
	location ^~ /probes/ {
		try_files $uri $uri/ =404;
		default_type application/json;
		add_header Cache-Control "public, max-age=60";
		autoindex on;
	}

	location / {
		proxy_pass http://gooncitizen_relay;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
